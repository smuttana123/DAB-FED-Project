name: Databricks Bundle CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate-dev:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DATABRICKS_HOST" || (echo "Missing secret: DATABRICKS_HOST" && exit 1)
          test -n "$DATABRICKS_TOKEN" || (echo "Missing secret: DATABRICKS_TOKEN" && exit 1)

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target dev

  validate-prod:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DATABRICKS_HOST" || (echo "Missing secret: DATABRICKS_HOST" && exit 1)
          test -n "$DATABRICKS_TOKEN" || (echo "Missing secret: DATABRICKS_TOKEN" && exit 1)

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DATABRICKS_HOST" || (echo "Missing secret: DATABRICKS_HOST" && exit 1)
          test -n "$DATABRICKS_TOKEN" || (echo "Missing secret: DATABRICKS_TOKEN" && exit 1)

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target dev

      - name: Deploy bundle to dev
        run: databricks bundle deploy --target dev

      - name: Run dev job
        run: databricks bundle run --target dev sample_job

      - name: Show dev deployment summary
        run: databricks bundle summary --target dev

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$DATABRICKS_HOST" || (echo "Missing secret: DATABRICKS_HOST" && exit 1)
          test -n "$DATABRICKS_TOKEN" || (echo "Missing secret: DATABRICKS_TOKEN" && exit 1)

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod

      - name: Deploy bundle to prod
        run: databricks bundle deploy --target prod

      - name: Run prod job
        run: databricks bundle run --target prod sample_job

      - name: Show prod deployment summary
        run: databricks bundle summary --target prod
